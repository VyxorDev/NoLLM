[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nolllm-ai"
version = "0.1.0"
description = "A local-first, low-resource AI research engine without large language models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VyxorDev"}]
dependencies = []

[project.scripts]
nolllm = "nolllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
